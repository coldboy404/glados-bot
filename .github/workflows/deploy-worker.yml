name: Deploy Worker
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runtime_probe:
        description: 'Temporary minimal-source diagnostic; only before webhook migration'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: glados-worker-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.credentials.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check worker.js
      - id: credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Deployment skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.' >> "$GITHUB_STEP_SUMMARY"
          fi
  deploy:
    needs: validate
    if: needs.validate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolate runtime from application source
        if: github.event_name == 'workflow_dispatch' && inputs.runtime_probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Bot still points to Pages; temporarily isolate this not-yet-live Worker.
          printf '%s\n' 'export default { fetch() { return new Response("runtime-probe-ok"); } };' > runtime-probe.js
          npx --yes wrangler@4.153.0 deploy runtime-probe.js --keep-vars
          code=$(curl --silent --show-error --max-time 20 --output probe.txt --write-out '%{http_code}' https://glados-bot.jwpgod.workers.dev/)
          echo "Minimal runtime probe HTTP: $code"
          if [ "$code" = '200' ] && [ "$(cat probe.txt)" = 'runtime-probe-ok' ]; then
            echo 'Minimal source works: investigate application initialization next.'
          else
            echo 'Minimal source also fails: application fingerprint is not established as the cause.'
          fi
      - name: Deploy existing Worker with Dashboard variables preserved
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.153.0 deploy --keep-vars
      - name: Verify live Worker and capture runtime exceptions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          subdomain=$(curl --silent --show-error --fail \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"]["subdomain"])')
          url="https://glados-bot.$subdomain.workers.dev/"
          timeout 35s npx --yes wrangler@4.153.0 tail glados-bot --format json > runtime-tail.json 2>runtime-tail.stderr &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true' EXIT
          sleep 8
          code=$(curl --silent --show-error --max-time 20 --output health.json --write-out '%{http_code}' "$url")
          sleep 5
          if [ "$code" != '200' ]; then
            echo "Worker health failed: HTTP $code. Webhook must not be migrated yet."
            python3 - <<'PY'
          import json
          from pathlib import Path
          raw = Path('runtime-tail.json').read_text()
          decoder = json.JSONDecoder()
          while raw.strip():
              raw = raw.lstrip()
              try:
                  event, end = decoder.raw_decode(raw)
              except ValueError:
                  break
              for error in event.get('exceptions', []):
                  print(error.get('name'), error.get('message'))
              raw = raw[end:]
          PY
            exit 1
          fi
          python3 -c 'import json; assert json.load(open("health.json")).get("status") == "running"'
